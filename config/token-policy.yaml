priority_order:
  - safety
  - correctness
  - compliance
  - token_economy
  - latency
  - convenience
allow_extra_latency_for_token_savings: true
context:
  max_agent_tokens_per_cycle: 8000
  max_handoff_tokens: 700
  max_cycle_report_tokens: 500
  max_repeated_context_tokens: 0
  compression_required_before_handoff: true
runtime:
  max_input_tokens_per_conversation: 1500
  max_output_tokens_per_conversation: 300
  fast_path_before_ai: true
  cache_before_ai: true
  send_only_relevant_vehicles: 3
measurement:
  required: true
  unknown_status: not_measured
  block_green_without_measurement: true
